name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare static files
        run: |
          mkdir -p dist
          cp index.html styles.css app.js dist/

      - name: Deploy to Pages
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -Fq 'it-strategy'; then
            npx --yes wrangler@4 pages project create it-strategy --production-branch=main
          fi
          npx --yes wrangler@4 pages deploy ./dist --project-name=it-strategy --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
